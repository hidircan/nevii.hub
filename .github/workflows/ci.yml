name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: bash scripts/check-repo-hygiene.sh --tree
      - run: node scripts/check-cache-headers.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
