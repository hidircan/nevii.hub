name: Production DB Migration

# Runs when prisma/migrations/** changes land on main, OR on-demand via the
# Actions tab (workflow_dispatch) for an auditable manual trigger. App code
# changes alone never fire this. Kept fully separate from
# .github/workflows/ci.yml (build/lint/test/typecheck) and from app
# deployment (handled by Vercel's own GitHub integration, outside GitHub
# Actions — this repo has no app-deploy job to separate from) — a migration
# failure here never blocks or is blocked by the app build/deploy path.
on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two migration deploys against production at the same time; never
# cancel one mid-flight (a cancelled `prisma migrate deploy` can leave the
# _prisma_migrations table in a partial state).
concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block destructive SQL without an explicit override
        # Scans every migration.sql in the repo (not just ones changed by
        # this push) — cheap at this repo's size, and robust across both
        # trigger types (push diffing is fragile for workflow_dispatch,
        # which has no "before" commit). Any migration.sql containing a
        # genuinely dangerous statement fails the job by default. To ship an
        # intentionally destructive migration, add a comment line
        # "-- migration-safety: acknowledged <short reason>" inside that
        # specific migration.sql — a deliberate, reviewable opt-out, never a
        # silent bypass.
        run: |
          fail=0
          shopt -s globstar nullglob
          for f in prisma/migrations/**/migration.sql; do
            [ -f "$f" ] || continue
            acknowledged=0
            grep -qi 'migration-safety: acknowledged' "$f" && acknowledged=1

            if grep -Eqi 'DROP[[:space:]]+TABLE|DROP[[:space:]]+COLUMN|TRUNCATE|DELETE[[:space:]]+FROM|ALTER[[:space:]]+TABLE.*DROP' "$f"; then
              if [ "$acknowledged" = "1" ]; then
                echo "$f: destructive statement found, but explicitly acknowledged — allowing."
              else
                echo "$f: BLOCKED — destructive statement (DROP TABLE/COLUMN, ALTER TABLE ... DROP,"
                echo "  TRUNCATE, or DELETE FROM) with no '-- migration-safety: acknowledged <reason>' comment."
                fail=1
              fi
            fi

            if grep -Eqi 'ALTER[[:space:]]+TABLE.*ALTER COLUMN.*SET NOT NULL' "$f" && [ "$acknowledged" != "1" ]; then
              echo "$f: BLOCKED — SET NOT NULL on an existing column with no explicit backfill/default"
              echo "  and no '-- migration-safety: acknowledged <reason>' comment (can fail on existing NULL rows)."
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo ""
            echo "One or more migrations look potentially destructive. Review manually, then add"
            echo "'-- migration-safety: acknowledged <short reason>' to the specific migration.sql"
            echo "file(s) and push (or re-run) again."
            exit 1
          fi
          echo "No unacknowledged destructive statements found."

  deploy:
    needs: safety-check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy pending migrations
        run: npx prisma migrate deploy
        env:
          # Add DATABASE_URL as a Secret on the "production" GitHub
          # Environment (Settings → Environments → production → Secrets).
          # Never put the connection string in this file, a commit, or any
          # workflow log — and never echo/print this env var in any step.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify migration status
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
