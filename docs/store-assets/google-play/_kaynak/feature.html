<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 0% 0%, #FFF9EE 0%, #FDF3E1 45%, #F3DDB4 100%);
    font-family: Inter, system-ui, sans-serif; color: #2A2118; position: relative;
  }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .tile { width: 92px; height: 92px; border-radius: 22px; background: #fff; box-shadow: 0 10px 30px rgba(122,78,0,.18); overflow: hidden; }
  .tile img { width: 100%; height: 100%; display: block; }
  h1 { font-family: "Noto Serif", serif; font-weight: 700; font-size: 54px; margin: 0; letter-spacing: -0.5px; }
  p { font-family: "Noto Serif", serif; font-weight: 600; font-size: 27px; line-height: 1.3; margin: 0; color: #4A3A22; }
  .rule { width: 72px; height: 5px; border-radius: 3px; background: #A56A00; }
  .phones { position: absolute; right: 40px; top: 36px; width: 440px; height: 520px; }
  .phone { position: absolute; width: 214px; height: 428px; border-radius: 30px; background: #1d1813; padding: 8px; box-shadow: 0 24px 50px rgba(42,33,24,.28); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 23px; display: block; }
  .p1 { left: 18px; top: 48px; transform: rotate(-6deg); }
  .p2 { left: 206px; top: 4px; transform: rotate(5deg); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="tile"><img src="icon.png" alt=""></div><h1>Nevii Hub</h1></div>
    <div class="rule"></div>
    <p>Ders programı, ödevler, gelişim ve ödemeler — tek uygulamada.</p>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="06-ogretmen-program.png" alt=""></div>
    <div class="phone p2"><img src="02-ogrenci-anasayfa.png" alt=""></div>
  </div>
</body>
</html>
