<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #FDF3E1 0%, #F6E4C2 100%);
    font-family: Inter, system-ui, sans-serif; color: #2A2118;
    display: flex; flex-direction: column; align-items: center;
  }
  .cap { margin-top: 120px; width: 880px; text-align: center; }
  .kicker { font-size: 30px; letter-spacing: 3px; text-transform: uppercase; color: #A56A00; margin-bottom: 18px; }
  h1 { font-family: "Noto Serif", serif; font-weight: 700; font-size: 66px; line-height: 1.15; margin: 0; }
  .phone { margin-top: 90px; width: 740px; height: 1316px; border-radius: 86px; background: #1d1813; padding: 22px; box-shadow: 0 50px 90px rgba(42,33,24,.30); box-sizing: content-box; }
  .phone img { width: 740px; height: 1316px; object-fit: cover; object-position: top; border-radius: 66px; display: block; }
</style>
</head>
<body>
  <div class="cap"><div class="kicker" id="k"></div><h1 id="t"></h1></div>
  <div class="phone"><img id="s" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('k').textContent = q.get('k') || '';
    document.getElementById('t').textContent = q.get('t') || '';
    document.getElementById('s').src = q.get('s');
  </script>
</body>
</html>
